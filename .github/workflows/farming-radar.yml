name: Atlas Real Estate Farming Radar

on:
  schedule:
    # 06:00 Bangkok time (UTC+7) = 23:00 UTC previous day
    - cron: '0 23 * * *'
    # 18:00 Bangkok time (UTC+7) = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-farming:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Atlas Farming Engine
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python farming/engine.py

      - name: Commit and push updated farmed listings
        run: |
          git config --global user.name "Atlas Farming Bot"
          git config --global user.email "atlas-bot@users.noreply.github.com"
          git add farmed_listings.json farming/data/
          if git diff --staged --quiet; then
            echo "No changes in farmed listings."
          else
            git commit -m "chore(radar): update farmed listings at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
